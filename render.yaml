services:
  - type: web
    name: norna-staging
    runtime: python
    plan: free
    buildCommand: python -m compileall .
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DEV_MODE
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
