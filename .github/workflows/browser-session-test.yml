name: NORNA browser session test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-session-test.yml"

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test login and reload
        shell: bash
        run: |
          cat > browser-session.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://norna-staging.onrender.com';
          const email=`browser-session-${Date.now()}@example.com`;
          const password='TesteNorna123!';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.setDefaultTimeout(60000);
          page.setDefaultNavigationTimeout(90000);
          const pageErrors=[];
          page.on('pageerror', e=>pageErrors.push(e.message));

          await page.goto(base+'/acesso.html?mode=register',{waitUntil:'domcontentloaded',timeout:90000});
          await page.fill('#registerEmail',email);
          await page.fill('#registerPassword',password);
          await page.fill('#registerPassword2',password);
          await page.click('#registerForm button[type="submit"]');
          await page.waitForSelector('#authMessage:not(.hidden)');

          await page.click('#registerForm [data-auth="login"]');
          await page.fill('#loginEmail',email);
          await page.fill('#loginPassword',password);
          await page.click('#loginForm button[type="submit"]');
          await page.waitForURL('**/app.html',{timeout:90000});
          await page.waitForSelector('#page-dashboard',{timeout:60000});
          await page.waitForTimeout(2500);
          if(!page.url().endsWith('/app.html')) throw new Error('Saiu do app depois do login');
          if(pageErrors.length) throw new Error('Erro JS após login: '+pageErrors.join(' | '));

          await page.reload({waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#page-dashboard',{timeout:60000});
          await page.waitForTimeout(2500);
          console.log('AFTER RELOAD:',page.url());
          if(!page.url().endsWith('/app.html')) throw new Error('Sessão não persistiu após atualizar');
          if(pageErrors.length) throw new Error('Erro JS após reload: '+pageErrors.join(' | '));

          const bodyBg=await page.evaluate(()=>getComputedStyle(document.body).backgroundColor);
          console.log('BODY BACKGROUND:',bodyBg);

          await page.click('[data-page="perfil"]');
          await page.fill('#profileName','Camila Monteiro');
          await page.waitForTimeout(1600);
          const typed=await page.inputValue('#profileName');
          console.log('PROFILE NAME:',typed);
          if(typed!=='Camila Monteiro') throw new Error('Espaços do perfil foram alterados');

          await page.reload({waitUntil:'domcontentloaded',timeout:90000});
          await page.click('[data-page="perfil"]');
          await page.waitForTimeout(1200);
          const savedName=await page.inputValue('#profileName');
          console.log('PROFILE NAME AFTER RELOAD:',savedName);
          if(savedName!=='Camila Monteiro') throw new Error('Perfil não persistiu corretamente');

          await page.fill('#profileAge','32');
          await page.fill('#profileArea','Ciência de Dados');
          await page.selectOption('#profileLevel',{label:'Júnior'});
          await page.waitForTimeout(1200);
          const topProfile=await page.textContent('#topProfileChip');
          console.log('TOP PROFILE:',topProfile);
          if(!topProfile.includes('32 anos')) throw new Error('Idade não apareceu no topo');
          if(!topProfile.includes('Ciência de Dados Júnior')) throw new Error('Objetivo não apareceu no topo');

          await page.click('[data-page="ia"]');
          await page.waitForSelector('#page-ia.active');
          if(await page.locator('.page.active').count()!==1) throw new Error('Mais de uma tela ficou ativa');

          await page.click('[data-page="dashboard"]');
          await page.waitForSelector('#page-dashboard.active');
          if(await page.locator('#dashAvatar').count()) throw new Error('Foto ainda aparece no Dashboard');
          const greeting=await page.textContent('#dashHello');
          if(!greeting?.trim()) throw new Error('Saudação do Dashboard não apareceu');

          await page.click('[data-page="curriculo"]');
          await page.waitForSelector('#page-curriculo.active');
          const resumeButtons=await page.locator('#page-curriculo input[type="file"]').count();
          if(resumeButtons!==1) throw new Error('Tela de currículo não foi simplificada');

          await page.setInputFiles('#resumeFile',{
            name:'curriculo-norna.txt',
            mimeType:'text/plain',
            buffer:Buffer.from(`Camila Monteiro
Ciência de Dados Júnior

RESUMO PROFISSIONAL
Profissional em transição para Ciência de Dados.

COMPETÊNCIAS TÉCNICAS
Python
SQL
MySQL
Pandas

CURSOS E CERTIFICAÇÕES
Oracle Next Education — Alura
Formação em Ciência de Dados — Alura

FORMAÇÃO ACADÊMICA
Ciências Biológicas — Universidade Iguaçu — 2015
`)
          });
          await page.waitForFunction(()=>document.querySelector('#resumeImportStatus')?.textContent.includes('Currículo lido'));
          await page.waitForTimeout(1000);

          await page.click('[data-page="competencias"]');
          await page.waitForSelector('#page-competencias.active');
          const pythonCard=page.locator('.skill-item').filter({hasText:'Python'}).first();
          if(await pythonCard.count()!==1) throw new Error('Python não foi importado para Competências');
          if(!(await pythonCard.textContent()).includes('85%')) throw new Error('Competência do currículo não entrou como forte');

          await page.click('[data-page="cursos"]');
          await page.waitForSelector('#page-cursos.active');
          const courseText=await page.textContent('#courseList');
          if(!courseText.includes('Oracle Next Education')) throw new Error('Curso do currículo não foi importado');

          const footer=await page.textContent('.app-footer');
          if(!footer.includes('Camila Monteiro') || !footer.includes('2026')) throw new Error('Rodapé não apareceu');

          const nativeContext=await browser.newContext({
            userAgent:'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36 NORNA-Android/0.2',
            viewport:{width:390,height:844}
          });
          const native=await nativeContext.newPage();
          await native.goto(base+'/mobile.html?mode=login',{waitUntil:'domcontentloaded',timeout:90000});
          await native.fill('#loginEmail',email);
          await native.fill('#loginPassword',password);
          await native.click('#loginForm button[type="submit"]');
          await native.waitForURL('**/app.html',{timeout:90000});
          await native.waitForSelector('body.native-app');
          await native.waitForSelector('#nativeBottomNav');
          if(await native.locator('.page.active').count()!==1) throw new Error('Android mostrou várias telas juntas');

          await native.click('[data-mobile-page="curriculo"]');
          await native.waitForSelector('#page-curriculo.active');
          if(await native.locator('.page.active').count()!==1) throw new Error('Menu Android não separou as telas');

          await native.click('[data-mobile-page="ia"]');
          await native.waitForSelector('#page-ia.active');

          console.log('SESSION + PROFILE + ANDROID FLOW OK');
          await nativeContext.close();
          await browser.close();
          EOF
          node browser-session.mjs
