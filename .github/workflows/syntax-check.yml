name: NORNA syntax check

on:
  push:
    branches: [main]
    paths:
      - "script.js"
      - "auth.js"
      - "public.js"
      - "server.py"
      - "norna_extras.py"
      - ".github/workflows/syntax-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript
        run: |
          node --check script.js
          node --check auth.js
          node --check public.js
      - name: Check Python
        run: python -m py_compile server.py norna_extras.py
