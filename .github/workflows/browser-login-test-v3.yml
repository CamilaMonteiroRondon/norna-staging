name: NORNA browser login test v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-login-test-v3.yml"

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test browser login persistence
        shell: bash
        run: |
          cat > browser-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base='https://norna-staging.onrender.com';
          const email=`browser-${Date.now()}@example.com`;
          const password='TesteNorna123!';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.setDefaultTimeout(60000);
          page.setDefaultNavigationTimeout(90000);
          page.on('pageerror', e=>errors.push(e.message));
          page.on('console', m=>{ if(m.type()==='error') errors.push(m.text()) });

          await page.goto(base+'/acesso.html?mode=register',{waitUntil:'domcontentloaded',timeout:90000});
          await page.fill('#registerEmail',email);
          await page.fill('#registerPassword',password);
          await page.fill('#registerPassword2',password);
          await page.click('#registerForm button[type="submit"]');
          await page.waitForSelector('#authMessage:not(.hidden)');
          console.log('REGISTER:',await page.textContent('#authMessage'));

          await page.click('#registerForm [data-auth="login"]');
          await page.fill('#loginEmail',email);
          await page.fill('#loginPassword',password);
          await page.click('#loginForm button[type="submit"]');
          await page.waitForURL('**/app.html',{timeout:90000});
          await page.waitForSelector('#page-dashboard',{timeout:60000});
          await page.waitForTimeout(2500);

          console.log('AFTER LOGIN:',page.url());
          console.log('ERRORS:',JSON.stringify(errors));
          if(!page.url().endsWith('/app.html')) throw new Error('Redirected away after login');
          if(errors.length) throw new Error('Frontend errors: '+errors.join(' | '));

          await page.reload({waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForSelector('#page-dashboard',{timeout:60000});
          await page.waitForTimeout(1500);
          console.log('AFTER RELOAD:',page.url());
          if(!page.url().endsWith('/app.html')) throw new Error('Session did not persist on reload');

          console.log('BROWSER FLOW OK');
          await browser.close();
          EOF
          node browser-test.mjs
