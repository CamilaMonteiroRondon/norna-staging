plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camilamonteiro.norna'
    compileSdk 35

    defaultConfig {
        applicationId "com.camilamonteiro.norna"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.2.1"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-test"
        }
        release {
            minifyEnabled false
        }
    }
}
